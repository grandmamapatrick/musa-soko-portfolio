<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musa Soko | Contact</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
       TOKENS — mirrored from index/about so contact lives in the same
       visual world.
       ============================================================ */
      :root {
        --paper: #f6f4ef;
        --paper-panel: #ecebe4;
        --ink: #0f0f0f;
        --ink-soft: rgba(15, 15, 15, 0.55);
        --ink-muted: rgba(15, 15, 15, 0.32);
        --line: rgba(15, 15, 15, 0.14);

        --cyan: #0092c9;
        --red: #e24632;
        --orange: #f69223;
        --purple: #6513e0;
        --lime: #d1e82d;
        --lavender: #8378d8;
        --success: #2f8f52;

        --font-display: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "Space Mono", ui-monospace, monospace;

        /* Noise tile — populated at runtime, same generator as the site */
        --faq-noise-tile: none;
        --faq-noise-opacity: 0.22;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: var(--font-display);
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ============================================================
       NAV — fixed, paper background, account-box logo. Matches about.
       ============================================================ */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        max-width: 1350px;
        margin: 0 auto;
        padding: 24px clamp(24px, 4vw, 64px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--paper);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
      }
      .logo-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .nav-links {
        display: flex;
        gap: 28px;
      }
      .nav-links a {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid transparent;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }
      .nav-links a:hover {
        color: var(--cyan);
        border-color: currentColor;
      }
      .nav-links a.active {
        color: var(--cyan);
        border-color: currentColor;
      }

      /* ============================================================
       LAYOUT — two columns: pitch on the left, form on the right.
       ============================================================ */
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
        max-width: 1350px;
        margin: 0 auto;
      }

      .content-side {
        padding: 140px clamp(24px, 4vw, 64px) 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }

      .section-eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .eyebrow-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(40px, 6vw, 76px);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
        margin-bottom: 22px;
      }
      .content-sub {
        font-family: var(--font-display);
        font-size: clamp(16px, 1.8vw, 20px);
        font-weight: 400;
        color: var(--ink-soft);
        max-width: 34ch;
      }

      /* ============================================================
       SIGNAL AREA — the easter egg. Sits bottom-left. Inert until the
       message field crosses 25 chars, then the label morphs into
       "wanna see something cool?" and becomes a live link.
       ============================================================ */
      .signal-area {
        position: absolute;
        bottom: 60px;
        left: clamp(24px, 4vw, 64px);
        display: flex;
        align-items: flex-end;
        gap: 12px;
        text-decoration: none;
        color: inherit;
        z-index: 10;
        height: 30px;
        cursor: default;
      }
      .signal-area.live {
        cursor: pointer;
      }
      .signal-area.live .peak-container,
      .signal-area.live .signal-label {
        animation: pulse-glow 1.2s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 0 rgba(101, 19, 224, 0));
        }
        50% {
          filter: drop-shadow(0 0 7px rgba(101, 19, 224, 0.6));
        }
      }
      .peak-container {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 20px;
        margin-bottom: 2px;
      }
      .peak-bar {
        width: 4px;
        height: 4px;
        background: var(--ink);
        transition:
          height 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          background 0.2s;
      }
      .peak-bar.active {
        background: var(--purple);
      }
      .signal-label {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        opacity: 0.5;
        line-height: 1;
      }
      .waving {
        opacity: 1 !important;
        color: var(--purple);
      }
      .waving span {
        display: inline-block;
        animation: wave-text 1.2s ease-in-out infinite;
      }
      @keyframes wave-text {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      /* ============================================================
       FORM SIDE — paper-panel with the site's grain, a left border
       divider, and a subtle dotted texture behind the form.
       ============================================================ */
      .form-side {
        position: relative;
        padding: 140px clamp(24px, 4vw, 64px) 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper-panel);
        border-left: 1px solid var(--line);
        overflow: hidden;
      }
      .form-side::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--faq-noise-tile);
        background-repeat: repeat;
        opacity: var(--faq-noise-opacity);
        pointer-events: none;
        z-index: 1;
      }

      #contactForm {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 480px;
      }
      .input-group {
        margin-bottom: 22px;
      }
      .input-group label {
        display: block;
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--ink-soft);
        margin-bottom: 8px;
      }
      .input-group input,
      .input-group textarea {
        width: 100%;
        background: var(--paper);
        border: 1px solid var(--ink);
        padding: 16px;
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 500;
        color: var(--ink);
        transition: border-color 0.2s ease;
      }
      .input-group input::placeholder,
      .input-group textarea::placeholder {
        color: var(--ink-muted);
        font-weight: 400;
      }
      .input-group input:focus,
      .input-group textarea:focus {
        outline: none;
        border-color: var(--cyan);
      }
      .input-group textarea {
        resize: vertical;
        min-height: 120px;
      }

      /* Submit button — ink fill, cyan hover, plus the encoding /
         success / error states from the original. */
      button {
        width: 100%;
        background: var(--ink);
        color: var(--paper);
        border: 1px solid var(--ink);
        padding: 18px;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          background 0.3s,
          color 0.3s;
      }
      button:hover:not(:disabled) {
        background: var(--cyan);
        border-color: var(--cyan);
        color: var(--paper);
      }
      button:disabled {
        cursor: wait;
      }
      button.encoding {
        background: var(--ink);
        color: var(--lime);
      }
      button.success {
        background: var(--success);
        color: var(--paper);
        border-color: var(--success);
        cursor: default;
      }
      button.error {
        background: var(--red);
        color: var(--paper);
        border-color: var(--red);
      }
      .btn-progress {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: rgba(209, 232, 45, 0.18);
        width: 0%;
        transition: width 0.1s linear;
      }

      /* ============================================================
       RESPONSIVE — single column below 900px, form on top visually
       kept second (pitch first).
       ============================================================ */
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          min-height: 0;
        }
        .content-side {
          padding: 120px 32px 90px;
          min-height: 60vh;
          justify-content: flex-end;
        }
        .form-side {
          padding: 60px 32px 80px;
          border-left: none;
          border-top: 1px solid var(--line);
        }
        .signal-area {
          bottom: 36px;
          left: 32px;
        }
      }
      @media (max-width: 720px) {
        nav {
          padding: 18px 20px;
        }
        .nav-links {
          gap: 8px;
        }
        .nav-links a {
          font-size: 10px;
          padding: 5px 8px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">
        <svg
          class="logo-icon"
          viewBox="0 0 22 22"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M4 2H18V3H19V4H20V18H19V19H18V20H4V19H3V18H2V4H3V3H4V2M4 16H5V15H7V14H15V15H17V16H18V5H17V4H5V5H4V16M16 18V17H14V16H8V17H6V18H16M9 5H13V6H14V7H15V11H14V12H13V13H9V12H8V11H7V7H8V6H9V5M12 8V7H10V8H9V10H10V11H12V10H13V8H12Z"
          />
        </svg>
        <span>Musa Soko</span>
      </a>
      <div class="nav-links">
        <a href="index.html#work">Work</a>
        <a href="about.html">About</a>
        <a href="index.html#faq">FAQ</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>

    <main>
      <section class="content-side">
        <div class="section-eyebrow">
          <svg
            class="eyebrow-icon"
            viewBox="0 0 22 22"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M2 4H20V5H21V17H20V18H2V17H1V5H2V4M4 6V7H5V8H6V9H7V10H8V11H10V12H12V11H14V10H15V9H16V8H17V7H18V6H4M3 8V16H19V8H18V9H17V10H16V11H15V12H14V13H12V14H10V13H8V12H7V11H6V10H5V9H4V8H3Z"
            />
          </svg>
          <span>Contact</span>
        </div>
        <h1>
          wanna work<br />
          together?
        </h1>
        <p class="content-sub">Let's make something memorable.</p>

        <!-- Signal easter egg — becomes a live link to the scratchbook
             once the message field crosses 25 characters. -->
        <a href="sketchbook.html" class="signal-area">
          <div class="peak-container">
            <div class="peak-bar" id="bar1"></div>
            <div class="peak-bar" id="bar2"></div>
            <div class="peak-bar" id="bar3"></div>
          </div>
          <span class="signal-label" id="signalLabel">Input Signal</span>
        </a>
      </section>

      <section class="form-side">
        <form
          id="contactForm"
          action="https://api.web3forms.com/submit"
          method="POST"
        >
          <input
            type="hidden"
            name="access_key"
            value="db0c33f1-c6ab-4902-a9ee-327ea04f3472"
          />
          <input
            type="hidden"
            name="subject"
            id="subjectField"
            value="New enquiry from your portfolio"
          />
          <input type="hidden" name="replyto" id="replytoField" value="" />
          <input type="hidden" name="from_name" value="Musa Soko Portfolio" />
          <input type="hidden" name="redirect" value="false" />

          <div class="input-group">
            <label>name</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="your name"
              required
            />
          </div>
          <div class="input-group">
            <label>email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="hello@domain.com"
              required
            />
          </div>
          <div class="input-group">
            <label>message</label>
            <textarea
              name="message"
              id="message"
              rows="5"
              placeholder="what's the project?"
            ></textarea>
          </div>
          <button type="submit" id="submitBtn">
            <div class="btn-progress" id="btnProgress"></div>
            <span id="btnText">send message</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      // ============================================================
      // NOISE TILE — same generator as the FAQ items, powers the grain
      // overlay on the form side.
      // ============================================================
      const FAQ_NOISE = { tileSize: 160, density: 0.85, dotAlphaMax: 0.35 };
      function makeFaqNoise() {
        const c = document.createElement("canvas");
        c.width = c.height = FAQ_NOISE.tileSize;
        const ctx = c.getContext("2d");
        const img = ctx.createImageData(c.width, c.height);
        const data = img.data;
        for (let i = 0; i < data.length; i += 4) {
          if (Math.random() < FAQ_NOISE.density) {
            data[i] = data[i + 1] = data[i + 2] = 0;
            data[i + 3] = FAQ_NOISE.dotAlphaMax * 255 * Math.random();
          } else {
            data[i + 3] = 0;
          }
        }
        ctx.putImageData(img, 0, 0);
        return `url("${c.toDataURL()}")`;
      }
      requestAnimationFrame(() => {
        document.documentElement.style.setProperty(
          "--faq-noise-tile",
          makeFaqNoise(),
        );
      });

      // ============================================================
      // SIGNAL BARS — react to typing; the label morphs into a live
      // scratchbook link once the message crosses 25 characters.
      // ============================================================
      const bars = [
        document.getElementById("bar1"),
        document.getElementById("bar2"),
        document.getElementById("bar3"),
      ];
      const signalLabel = document.getElementById("signalLabel");
      const messageArea = document.getElementById("message");
      const signalArea = document.querySelector(".signal-area");

      // Keep the signal link inert until the "wanna see something cool?" state
      signalArea.addEventListener("click", (e) => {
        if (!signalArea.classList.contains("live")) e.preventDefault();
      });

      document
        .querySelectorAll("input[type=text], input[type=email], textarea")
        .forEach((input) => {
          input.addEventListener("input", () => {
            bars.forEach((b) => {
              b.style.height = `${Math.floor(Math.random() * 20) + 10}px`;
              b.classList.add("active");
            });
            if (messageArea.value.length > 25) {
              if (!signalLabel.classList.contains("waving")) {
                signalLabel.innerHTML = "wanna see something cool?"
                  .split("")
                  .map(
                    (c, i) =>
                      `<span style="animation-delay:${i * 0.05}s">${c === " " ? "&nbsp;" : c}</span>`,
                  )
                  .join("");
                signalLabel.classList.add("waving");
                signalArea.classList.add("live");
              }
            } else {
              signalLabel.innerText = "Input Signal";
              signalLabel.classList.remove("waving");
              signalArea.classList.remove("live");
            }
            clearTimeout(input._t);
            input._t = setTimeout(() => {
              bars.forEach((b) => {
                b.style.height = "4px";
                b.classList.remove("active");
              });
            }, 150);
          });
        });

      // ============================================================
      // FORM SUBMISSION — Web3Forms, with the encoding progress
      // animation and render-complete / failed states.
      // ============================================================
      const form = document.getElementById("contactForm");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnProgress = document.getElementById("btnProgress");
      const subjectField = document.getElementById("subjectField");
      const replytoField = document.getElementById("replytoField");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!name || !email) {
          btnText.innerText = "name & email required ↑";
          setTimeout(() => {
            btnText.innerText = "send message";
          }, 2500);
          return;
        }

        subjectField.value = `New enquiry from ${name}`;
        replytoField.value = email;

        submitBtn.disabled = true;
        submitBtn.classList.add("encoding");
        let pct = 0;
        const iv = setInterval(() => {
          pct = Math.min(pct + Math.floor(Math.random() * 12) + 4, 90);
          btnText.innerText = `ENCODING: ${pct}%`;
          btnProgress.style.width = pct + "%";
          if (pct >= 90) clearInterval(iv);
        }, 80);

        try {
          const res = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: new FormData(form),
          });
          const data = await res.json();

          clearInterval(iv);

          if (res.ok && data.success) {
            btnProgress.style.width = "100%";
            btnText.innerText = "RENDER COMPLETE ✓";
            submitBtn.classList.remove("encoding");
            submitBtn.classList.add("success");
            form.reset();
            bars.forEach((b) => {
              b.style.height = "4px";
              b.classList.remove("active");
            });
            signalLabel.innerText = "Input Signal";
            signalLabel.classList.remove("waving");
            signalArea.classList.remove("live");
            setTimeout(() => {
              submitBtn.classList.remove("success");
              submitBtn.disabled = false;
              btnText.innerText = "send message";
              btnProgress.style.width = "0%";
            }, 4500);
          } else {
            throw new Error(data.message || "Submission failed");
          }
        } catch (err) {
          clearInterval(iv);
          btnProgress.style.width = "0%";
          btnText.innerText = "FAILED — try again";
          submitBtn.classList.remove("encoding");
          submitBtn.classList.add("error");
          setTimeout(() => {
            submitBtn.classList.remove("error");
            submitBtn.disabled = false;
            btnText.innerText = "send message";
          }, 3000);
          console.error("Form error:", err);
        }
      });
    </script>
  </body>
</html>
