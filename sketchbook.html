    <style>
      /* ============================================================
         SKETCHBOOK — minimal gallery. Cool light grey, hard edges,
         black type in Helvetica. The work does the talking.
         ============================================================ */
      :root {
        --bg: #f2f5f7; /* page */
        --panel: #c0cbd6; /* empty tiles */
        --ink: #0d0d0d; /* text */
        --dim: rgba(13, 13, 13, 0.58);
        --line: rgba(13, 13, 13, 0.16);
        --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --gap: 8px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        background: transparent;
        color: var(--ink);
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      button {
        font-family: inherit;
      }

      /* ---------- background texture ----------
         One layer fixed behind everything. Pick the look by changing the
         class on <body>: tex-crt, tex-spotlight, tex-weave, tex-grid,
         tex-dots, tex-grille. These were made for the dark version; the
         page is plain white right now, so none is switched on. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      body.tex-crt::before {
        /* faint scanlines */
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03) 0 1px,
          transparent 1px 3px
        );
      }
      body.tex-spotlight::before {
        /* gallery wall: a soft pool of light from above, darker edges */
        background:
          radial-gradient(
            ellipse 70% 55% at 50% 0%,
            rgba(255, 255, 255, 0.07),
            transparent 70%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            transparent 55%,
            rgba(0, 0, 0, 0.55) 100%
          );
      }
      body.tex-weave::before {
        /* fine linen / canvas weave */
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.022) 0 1px,
            transparent 1px 2px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.022) 0 1px,
            transparent 1px 3px
          );
      }
      body.tex-grid::before {
        /* tiny pixel grid */
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 /
            4px 4px,
          linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.035) 1px,
              transparent 1px
            )
            0 0 / 4px 4px;
      }
      body.tex-dots::before {
        /* halftone dots */
        background: radial-gradient(
            rgba(255, 255, 255, 0.08) 0.8px,
            transparent 1.3px
          )
          0 0 / 6px 6px;
      }
      body.tex-grille::before {
        /* RGB aperture grille plus scanlines, the closest to a real CRT */
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.4) 0 1px,
            transparent 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 60, 90, 0.035) 0 1px,
            rgba(80, 255, 140, 0.025) 1px 2px,
            rgba(90, 130, 255, 0.04) 2px 3px
          );
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* ---------- top bar ----------
         Just the way back to the portfolio. It sticks to the top so it's
         always there while scrolling the wall. */
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 16px clamp(16px, 4vw, 48px);
        pointer-events: none;
      }
      .home {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px 8px 10px;
        font-size: 13px;
        color: var(--ink);
        text-decoration: none;
        background: rgba(242, 245, 247, 0.72);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .home:hover {
        border-color: var(--ink);
      }
      .home svg {
        width: 14px;
        height: 14px;
        display: block;
      }

      /* ---------- header ---------- */
      .head {
        padding: clamp(12px, 3vw, 40px) clamp(16px, 4vw, 48px) 28px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .title {
        margin: 0;
        font-weight: 700;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1;
        letter-spacing: -0.02em;
      }
      /* title is hidden on screen but kept for search engines and
         screen readers */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .head-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-top: 0;
      }
      .blurb {
        max-width: 54ch;
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
        color: var(--dim);
      }
      .blurb b {
        color: var(--ink);
        font-weight: 700;
      }
      .shuffle {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--bg);
        background: var(--ink);
        border: 1px solid var(--ink);
        padding: 10px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .shuffle:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .shuffle svg {
        display: block;
      }

      /* ---------- the wall (masonry) ---------- */
      .wall {
        display: flex;
        gap: var(--gap);
        align-items: flex-start;
        padding: 8px clamp(16px, 4vw, 48px) 64px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .piece {
        position: relative;
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: var(--panel);
        overflow: hidden;
        cursor: default;
        color: inherit;
        text-align: left;
      }
      .piece .media {
        position: relative;
        width: 100%;
      }
      .piece img,
      .piece video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cap {
        /* the name fades in softly at the bottom on hover, no frame */
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 26px 10px 8px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.6),
          rgba(0, 0, 0, 0)
        );
        color: #ffffff;
        font-size: 12px;
        line-height: 1.3;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      .kind {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 20px;
        height: 20px;
        background: rgba(13, 13, 13, 0.6);
        display: grid;
        place-items: center;
      }
      @media (hover: hover) {
        .piece:hover .cap,
        .piece:focus-visible .cap {
          opacity: 1;
        }
      }
      /* touch screens: names always visible */
      @media (hover: none) {
        .cap {
          opacity: 1;
          font-size: 11px;
          padding: 20px 8px 6px;
        }
      }

      .empty {
        padding: 40px clamp(16px, 4vw, 48px);
        color: var(--dim);
        font-family: var(--mono);
        font-size: 14px;
      }

      /* ---------- viewer ----------
         A window that sits over the wall at the piece's own size, with
         the wall still visible (dimmed) behind it. Videos get a small
         player bar that matches the page. */
      .lb {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(242, 245, 247, 0.62);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .lb.open {
        display: flex;
      }
      .win {
        /* the viewer keeps its light colours in dark mode */
        --bg: #f2f5f7;
        --panel: #c0cbd6;
        --ink: #0d0d0d;
        --dim: rgba(13, 13, 13, 0.58);
        --line: rgba(13, 13, 13, 0.16);
        color: var(--ink);
        position: relative;
        background: var(--bg);
        border: 1px solid var(--ink);
        max-width: 92vw;
      }
      .win .stage {
        position: relative;
        background: var(--panel);
      }
      .win .stage img,
      .win .stage video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .win-foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 10px 12px 11px;
        font-size: 14px;
      }
      .win-foot b {
        font-weight: 700;
      }
      .win-meta {
        display: flex;
        align-items: baseline;
        gap: 14px;
        color: var(--dim);
        font-size: 13px;
      }
      .copy {
        font: inherit;
        color: var(--ink);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--line);
      }
      .copy:hover {
        text-decoration-color: var(--ink);
      }
      .win-close {
        position: absolute;
        top: -1px;
        right: -1px;
        width: 32px;
        height: 32px;
        border: 1px solid var(--ink);
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        z-index: 2;
      }
      .win-close:hover {
        background: var(--ink);
        color: var(--bg);
      }
      /* player bar */
      .pbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .pbtn {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        display: grid;
        place-items: center;
        flex: none;
      }
      .pbtn svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .pbtn.muted {
        opacity: 0.4;
      }
      .seek {
        position: relative;
        flex: 1;
        height: 18px;
        cursor: pointer;
        touch-action: none;
      }
      .seek::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        height: 2px;
        background: var(--line);
      }
      .seek i {
        position: absolute;
        left: 0;
        top: 8px;
        height: 2px;
        width: 0;
        background: var(--ink);
      }
      .ptime {
        color: var(--dim);
        white-space: nowrap;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 28px clamp(16px, 4vw, 48px) 40px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--dim);
        max-width: 1600px;
        margin: 0 auto;
      }
      footer a {
        color: var(--ink);
        text-underline-offset: 4px;
        text-decoration-color: var(--line);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <a class="home" href="index.html">
        <svg viewBox="0 0 22 22" fill="currentColor" aria-hidden="true">
          <path d="M4 10H6V8H8V6H10V10H18V12H10V16H8V14H6V12H4Z" />
        </svg>
        portfolio
      </a>
    </div>

    <header class="head">
      <h1 class="sr-only">Musa Soko sketchbook</h1>
      <div class="head-row">
        <p class="blurb">
          <b>beyond the work,</b> i just like making stuff. sketches,
          experiments, posters, motion bits, bloops and drafts, the stuff that
          doesn't usually see daylight.
        </p>
        <button class="shuffle" id="shuffle" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect
              x="1"
              y="1"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
            />
            <rect
              x="3.5"
              y="3.5"
              width="2.5"
              height="2.5"
              fill="currentColor"
            />
            <rect
              x="6.75"
              y="6.75"
              width="2.5"
              height="2.5"
              fill="currentColor"
            />
            <rect x="10" y="10" width="2.5" height="2.5" fill="currentColor" />
          </svg>
          shuffle a piece
        </button>
      </div>
    </header>

    <main class="wall" id="wall" aria-label="Sketchbook pieces"></main>

    <footer>
      <span>musa soko</span>
      <a href="mailto:musasoko.ln@gmail.com">musasoko.ln@gmail.com</a>
    </footer>

    <div
      class="lb"
      id="lb"
      role="dialog"
      aria-modal="true"
      aria-label="Piece viewer"
    >
      <div class="win" id="win">
        <button class="win-close" id="lbClose" type="button" aria-label="Close">
          ✕
        </button>
        <div class="stage" id="lbStage"></div>
        <div id="lbPlayer"></div>
        <div class="win-foot">
          <b id="lbTitle"></b
          ><span class="win-meta"
            ><span id="lbYear"></span
            ><button class="copy" id="lbCopy" type="button">
              copy link
            </button></span
          >
        </div>
      </div>
    </div>

    <script>
      /* ─────────────────────────────────────────────────────────────
         SKETCHBOOK PIECES live in sketchbook.json, next to this file.
         To add a piece, edit that file only. Its "how_to_add" notes
         explain the format.
         ───────────────────────────────────────────────────────────── */
      let works = [];

      const slug = (t) =>
        String(t)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");

      // GoatCounter: which pieces get opened (shows as open-sketch-<name>)
      function gcEvent(name) {
        try {
          if (window.goatcounter && window.goatcounter.count)
            window.goatcounter.count({ path: name, title: name, event: true });
        } catch (e) {}
      }

      const wall = document.getElementById("wall");
      let shown = [];

      // ---------- masonry ----------
      // Pinterest-style: each piece drops into whichever column is
      // currently shortest, using the known w/h so it's decided before
      // anything loads. Order still reads left to right, top to bottom.
      function columnCount() {
        const w = wall.clientWidth;
        if (w < 560) return 2;
        if (w < 900) return 3;
        if (w < 1300) return 4;
        return 5;
      }

      let currentCols = 0;
      function layout(force) {
        const n = columnCount();
        shown = works.slice();
        if (!force && n === currentCols) return;
        currentCols = n;
        stopObserving();
        wall.innerHTML = "";
        if (!shown.length) {
          wall.innerHTML = '<p class="empty">nothing in this pile yet.</p>';
          return;
        }
        const cols = [],
          heights = [];
        for (let i = 0; i < n; i++) {
          const c = document.createElement("div");
          c.className = "col";
          wall.appendChild(c);
          cols.push(c);
          heights.push(0);
        }
        shown.forEach((w, i) => {
          let k = 0;
          for (let j = 1; j < n; j++) if (heights[j] < heights[k] - 0.01) k = j;
          cols[k].appendChild(makeTile(w, i));
          heights[k] += w.h / w.w + 0.04;
        });
      }

      function makeTile(w, i) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "piece";
        b.setAttribute("aria-label", "open " + w.title);
        const media = document.createElement("div");
        media.className = "media";
        media.style.aspectRatio = w.w + " / " + w.h;
        if (w.kind === "video") {
          const v = document.createElement("video");
          v.muted = true;
          v.loop = true;
          v.playsInline = true;
          v.setAttribute("playsinline", "");
          v.preload = "none";
          v.dataset.src = w.src; // only loaded once it's near the screen
          media.appendChild(v);
          observe(v);
          const k = document.createElement("span");
          k.className = "kind";
          k.setAttribute("aria-hidden", "true");
          k.innerHTML =
            '<svg width="10" height="10" viewBox="0 0 22 22" fill="#ffffff"><path d="M10 5V6H11V7H12V8H13V9H14V10H15V12H14V13H13V14H12V15H11V16H10V17H9V18H7V4H9V5H10Z"/></svg>';
          media.appendChild(k);
        } else {
          const img = document.createElement("img");
          img.src = w.src;
          img.alt = w.title;
          img.width = w.w;
          img.height = w.h;
          img.loading = "lazy";
          img.decoding = "async";
          media.appendChild(img);
        }
        b.appendChild(media);
        const cap = document.createElement("span");
        cap.className = "cap";
        cap.textContent = w.title;
        b.appendChild(cap);
        b.addEventListener("click", () => openViewer(i));
        return b;
      }

      // ---------- videos on the wall ----------
      // Muted loops that only download when close to the screen, and
      // only play while visible, so a long scroll stays light.
      let io = null;
      const watched = new Set();
      function observe(v) {
        if (!("IntersectionObserver" in window)) {
          v.src = v.dataset.src;
          v.play().catch(() => {});
          return;
        }
        if (!io) {
          io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                const vid = e.target;
                if (e.isIntersecting) {
                  if (!vid.src) {
                    vid.src = vid.dataset.src;
                    vid.preload = "metadata";
                  }
                  vid.play().catch(() => {});
                } else if (!vid.paused) {
                  vid.pause();
                }
              });
            },
            { rootMargin: "200px 0px", threshold: 0.15 },
          );
        }
        io.observe(v);
        watched.add(v);
      }
      function stopObserving() {
        if (io) watched.forEach((v) => io.unobserve(v));
        watched.clear();
      }
      function pauseWall(paused) {
        watched.forEach((v) => {
          if (paused) v.pause();
        });
        if (!paused && io)
          watched.forEach((v) => {
            io.unobserve(v);
            io.observe(v);
          });
      }

      // ---------- viewer ----------
      const lb = document.getElementById("lb");
      const win = document.getElementById("win");
      const stage = document.getElementById("lbStage");
      const playerEl = document.getElementById("lbPlayer");
      let lastFocus = null;

      // Window width by shape, like the old sketchbook: portrait pieces
      // open narrow, landscape ones wide. Height is capped to the screen.
      function winWidth(w) {
        const ar = w.w / w.h;
        const base = ar > 1.15 ? 780 : ar < 0.87 ? 360 : 480;
        const maxByHeight = (window.innerHeight - 150) * ar; // leave room for bars
        return Math.max(220, Math.min(base, maxByHeight));
      }

      const ICON_PAUSE =
        '<svg viewBox="0 0 22 22" fill="currentColor"><path d="M6 4H9V18H6V4M13 18V4H16V18H13Z"/></svg>';
      const ICON_PLAY =
        '<svg viewBox="0 0 22 22" fill="currentColor"><path d="M10 5V6H11V7H12V8H13V9H14V10H15V12H14V13H13V14H12V15H11V16H10V17H9V18H7V4H9V5H10Z"/></svg>';
      const ICON_SOUND =
        '<svg viewBox="0 0 22 22" fill="currentColor"><path d="M3 8H7L12 4V18L7 14H3Z"/><path d="M14 8H16V14H14Z M17 6H19V16H17Z"/></svg>';
      const fmt = (t) => {
        t = Math.floor(t || 0);
        return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
      };

      function openViewer(i) {
        const w = shown[i];
        lastFocus = document.activeElement;
        stage.innerHTML = "";
        playerEl.innerHTML = "";
        win.style.width = winWidth(w) + "px";
        stage.style.aspectRatio = w.w + " / " + w.h;
        document.getElementById("lbTitle").textContent = w.title;
        document.getElementById("lbYear").textContent = w.year || "";

        if (w.kind === "video") {
          const v = document.createElement("video");
          v.src = w.src;
          v.loop = true;
          v.playsInline = true;
          v.setAttribute("playsinline", "");
          stage.appendChild(v);
          playerEl.innerHTML =
            '<div class="pbar"><button class="pbtn" data-pp aria-label="Play or pause"></button>' +
            '<div class="seek" role="slider" aria-label="Seek" tabindex="0"><i></i></div>' +
            '<span class="ptime">0:00</span>' +
            '<button class="pbtn" data-mute aria-label="Sound on or off">' +
            ICON_SOUND +
            "</button></div>";
          wirePlayer(v);
          v.play().catch(() => {
            v.muted = true;
            playerEl.querySelector("[data-mute]").classList.add("muted");
            v.play().catch(() => {});
          });
        } else {
          const img = document.createElement("img");
          img.src = w.src;
          img.alt = w.title;
          stage.appendChild(img);
        }
        lb.classList.add("open");
        pauseWall(true);
        // give the piece its own address, e.g. sketchbook.html#pink-black
        history.replaceState(null, "", "#" + slug(w.title));
        const copy = document.getElementById("lbCopy");
        copy.textContent = "copy link";
        document.getElementById("lbClose").focus({ focusVisible: false });
        gcEvent("open-sketch-" + slug(w.title));
      }

      function wirePlayer(v) {
        const pp = playerEl.querySelector("[data-pp]");
        const seek = playerEl.querySelector(".seek");
        const fill = seek.querySelector("i");
        const time = playerEl.querySelector(".ptime");
        const mute = playerEl.querySelector("[data-mute]");
        const sync = () => (pp.innerHTML = v.paused ? ICON_PLAY : ICON_PAUSE);
        const toggle = () => (v.paused ? v.play().catch(() => {}) : v.pause());
        pp.addEventListener("click", toggle);
        v.addEventListener("click", toggle);
        v.addEventListener("play", sync);
        v.addEventListener("pause", sync);
        v.addEventListener("timeupdate", () => {
          if (v.duration)
            fill.style.width = (v.currentTime / v.duration) * 100 + "%";
          time.textContent = fmt(v.currentTime) + " / " + fmt(v.duration);
        });
        const seekTo = (e) => {
          const r = seek.getBoundingClientRect();
          const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
          if (v.duration) v.currentTime = (x / r.width) * v.duration;
        };
        let dragging = false;
        seek.addEventListener("pointerdown", (e) => {
          dragging = true;
          seek.setPointerCapture(e.pointerId);
          seekTo(e);
        });
        seek.addEventListener("pointermove", (e) => dragging && seekTo(e));
        seek.addEventListener("pointerup", () => (dragging = false));
        seek.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight")
            v.currentTime = Math.min(v.duration || 0, v.currentTime + 5);
          if (e.key === "ArrowLeft")
            v.currentTime = Math.max(0, v.currentTime - 5);
        });
        mute.addEventListener("click", () => {
          v.muted = !v.muted;
          mute.classList.toggle("muted", v.muted);
        });
        sync();
      }

      function closeViewer() {
        if (!lb.classList.contains("open")) return;
        lb.classList.remove("open");
        stage.innerHTML = "";
        playerEl.innerHTML = "";
        pauseWall(false);
        history.replaceState(null, "", location.pathname + location.search);
        if (lastFocus) lastFocus.focus();
      }
      document.getElementById("lbClose").addEventListener("click", closeViewer);
      lb.addEventListener("click", (e) => {
        if (e.target === lb) closeViewer(); // click outside the window
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeViewer();
      });

      document.getElementById("lbCopy").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        try {
          await navigator.clipboard.writeText(location.href);
          btn.textContent = "link copied";
        } catch (err) {
          window.prompt("Copy this link:", location.href);
        }
      });

      // Open the piece named in the address, if there is one
      function openFromHash() {
        const key = decodeURIComponent(location.hash.slice(1));
        if (!key) return closeViewer();
        const i = shown.findIndex((w) => slug(w.title) === key);
        if (i > -1) openViewer(i);
        else closeViewer(); // unknown name: just show the wall
      }
      window.addEventListener("hashchange", openFromHash);

      document.getElementById("shuffle").addEventListener("click", () => {
        if (!shown.length) return;
        openViewer(Math.floor(Math.random() * shown.length));
      });

      let rt = 0;
      window.addEventListener("resize", () => {
        clearTimeout(rt);
        rt = setTimeout(() => layout(false), 150);
      });

      // ---------- start ----------
      fetch("sketchbook.json", { cache: "no-cache" })
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((data) => {
          works = (data.pieces || []).slice();
          // Fresh random order on every visit, so every piece gets its
          // turn up top. (sketchbook.json keeps your own order.)
          for (let i = works.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [works[i], works[j]] = [works[j], works[i]];
          }
          layout(true);
          openFromHash();
        })
        .catch(() => {
          wall.innerHTML =
            '<p class="empty">The pieces didn\'t load. Check that sketchbook.json is uploaded next to this page and has no missing commas. Opened from your computer? It only loads on the live site.</p>';
        });
    </script>
